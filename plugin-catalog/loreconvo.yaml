name: loreconvo
repo: https://github.com/labyrinth-analytics/loreconvo
sha: bb82f6ab70e8bc12d8b4cbb361b201c99a940c7f
subdir: integrations/phi
description: "LoreConvo memory provider: cross-surface persistent session memory with search, recall and structured memory items. Disclosure — stores end-of-session transcripts (truncated, including tool output) and Phi memory writes in ~/.loreconvo/sessions.db, a store shared across all Phi profiles and other LoreConvo clients, and injects context from those sessions into each turn; a Pro license enables a one-time Hugging Face embedding-model download; installs the loreconvo package (BUSL-1.1) with lancedb, fastembed and onnxruntime into the Phi environment."
tier: community
category: memory
maintainer: labyrinth-analytics
capabilities:
  provides_tools:
    - loreconvo_search_sessions
    - loreconvo_get_context
    - loreconvo_save_memory
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - LORECONVO_PHI_PROJECT
requires_phi: ">=0.21.0"
version: "0.10.18"
docs_url: https://github.com/labyrinth-analytics/loreconvo?tab=readme-ov-file#loreconvo
