name: vector-platform
repo: https://github.com/BonesGit/hermes-vector-platform
sha: 94e1af49a2dcbce4952cb3d17b8591b8e3e10bed
description: "Vector (vectorapp.io) messaging platform plugin: Phi becomes a first-class Nostr-based Vector bot (its own nsec/npub identity), relaying DMs through a local Rust sidecar that wraps vector-sdk. First run needs `phi gateway setup`, which provisions the bot identity (create or import). Disclosure — `phi gateway setup` downloads a prebuilt vector-bridge binary from github.com/BonesGit/phi-vector-platform/releases (tag v<version>, sha256 checked against that release's SHA256SUMS; set vector.prebuilt.download: false to build from the bundled Rust source), merges `vector:` settings into ~/.phi/config.yaml, writes VECTOR_* to ~/.phi/.env, and publishes a public bot profile (kind-0, bot: true) to Nostr discovery relays."
maintainer: BonesGit
tier: community
category: platform
docs_url: https://github.com/BonesGit/hermes-vector-platform
